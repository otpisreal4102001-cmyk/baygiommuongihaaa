<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryAnchor - Source-of-Truth AI Q&A Learning Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF.js & Mammoth.js for File Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [documentData, setDocumentData] = React.useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
            const [viewMode, setViewMode] = React.useState('keywords'); // 'keywords' | 'study' | 'review' | 'quiz'
            const [studyLevel, setStudyLevel] = React.useState(1); // 1: Full, 2: Partial, 3: Recall
            const [keywordsMap, setKeywordsMap] = React.useState({}); 
            const [studentAnswer, setStudentAnswer] = React.useState('');
            const [gradingResult, setGradingResult] = React.useState(null);
            const [isGrading, setIsGrading] = React.useState(false);
            const [reviewMistakes, setReviewMistakes] = React.useState([]); 
            const [quizQuestions, setQuizQuestions] = React.useState([]);
            const [quizIndex, setQuizIndex] = React.useState(0);
            const [quizAnswers, setQuizAnswers] = React.useState({});
            const [quizResults, setQuizResults] = React.useState(null);
            const [loadingMessage, setLoadingMessage] = React.useState('');
            const [mobileSidebarOpen, setMobileSidebarOpen] = React.useState(false);
            const [showNextOptions, setShowNextOptions] = React.useState(false);

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setLoadingMessage(`Đang phân tích file ${file.name}...`);

                try {
                    let extractedText = '';
                    const fileName = file.name;
                    const ext = fileName.split('.').pop().toLowerCase();

                    if (ext === 'txt') {
                        extractedText = await file.text();
                    } else if (ext === 'docx') {
                        if (typeof mammoth === 'undefined') {
                            throw new Error('Thư viện đọc file DOCX chưa tải xong. Vui lòng thử lại.');
                        }
                        const arrayBuffer = await file.arrayBuffer();
                        const result = await mammoth.extractRawText({ arrayBuffer });
                        extractedText = result.value;
                    } else if (ext === 'pdf') {
                        if (typeof pdfjsLib === 'undefined') {
                            throw new Error('Thư viện đọc file PDF chưa tải xong. Vui lòng thử lại.');
                        }
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        const arrayBuffer = await file.arrayBuffer();
                        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                        const pdf = await loadingTask.promise;
                        let textPages = [];
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            textPages.push(textContent.items.map(item => item.str).join(' '));
                        }
                        extractedText = textPages.join('\n');
                    } else {
                        alert('Định dạng file không hỗ trợ. Vui lòng tải lên file PDF, DOCX hoặc TXT.');
                        setLoadingMessage('');
                        return;
                    }

                    const parsedQuestions = parseQAFromText(extractedText);
                    const newDoc = {
                        id: 'doc_' + Date.now(),
                        filename: fileName,
                        originalText: extractedText,
                        questions: parsedQuestions.length > 0 ? parsedQuestions : [
                            { id: 'q_1', question: 'Nội dung tài liệu', originalAnswer: extractedText.slice(0, 500) }
                        ]
                    };

                    setDocumentData(newDoc);
                    setCurrentQuestionIndex(0);
                    setViewMode('keywords');
                    setKeywordsMap({});
                    setLoadingMessage('');
                } catch (err) {
                    console.error('File read error:', err);
                    alert('Lỗi khi đọc file: ' + err.message);
                    setLoadingMessage('');
                }
            };

            const parseQAFromText = (text) => {
                if (!text) return [];
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const questions = [];
                let currentQ = null;
                let currentA = [];
                const qRegex = /^(Question\s*\d*[\.\:\-]|Q\s*\d+[\.\:\-]|What|How|Why|When|Where|Who|Define|Explain|\d+[\.\)])/i;

                lines.forEach((line, idx) => {
                    if (qRegex.test(line) && line.length < 150) {
                        if (currentQ) {
                            questions.push({
                                id: 'q_' + (questions.length + 1),
                                question: currentQ,
                                originalAnswer: currentA.join(' ').trim() || 'Nội dung chi tiết từ tài liệu.'
                            });
                        }
                        currentQ = line.replace(/^(Question\s*\d*[\.\:\-]|Q\s*\d+[\.\:\-]|\d+[\.\)])\s*/i, '');
                        currentA = [];
                    } else {
                        if (currentQ) currentA.push(line);
                        else if (!currentQ && idx > 0) currentQ = line;
                    }
                });

                if (currentQ) {
                    questions.push({
                        id: 'q_' + (questions.length + 1),
                        question: currentQ,
                        originalAnswer: currentA.join(' ').trim() || text.slice(0, 300)
                    });
                }
                return questions;
            };

            const currentQuestion = documentData && documentData.questions ? documentData.questions[currentQuestionIndex] : null;

            const handleTextSelection = () => {
                const selection = window.getSelection();
                const selectedText = selection ? selection.toString().trim() : '';
                if (!selectedText || !currentQuestion) return;
                const qId = currentQuestion.id;
                const existing = keywordsMap[qId] || [];
                if (!existing.includes(selectedText)) {
                    setKeywordsMap({ ...keywordsMap, [qId]: [...existing, selectedText] });
                }
                if (selection) selection.removeAllRanges();
            };

            const addKeywordDirect = (word) => {
                if (!currentQuestion) return;
                const qId = currentQuestion.id;
                const existing = keywordsMap[qId] || [];
                if (!existing.includes(word)) {
                    setKeywordsMap({ ...keywordsMap, [qId]: [...existing, word] });
                }
            };

            const removeKeyword = (kwToRemove) => {
                if (!currentQuestion) return;
                const qId = currentQuestion.id;
                const existing = keywordsMap[qId] || [];
                setKeywordsMap({ ...keywordsMap, [qId]: existing.filter(kw => kw !== kwToRemove) });
            };

            const handleLevelChange = (newLvl) => {
                if (newLvl === studyLevel) return;
                const levelNames = { 1: 'Full Keywords', 2: 'Partial Keywords', 3: 'Pure Recall' };
                if (window.confirm(`Chuyển sang Level ${newLvl} (${levelNames[newLvl]})? Ô trả lời sẽ được làm mới.`)) {
                    setStudyLevel(newLvl);
                    setStudentAnswer('');
                    setGradingResult(null);
                }
            };

            const handleCheckAnswer = () => {
                if (!studentAnswer.trim()) {
                    alert('Vui lòng nhập câu trả lời!');
                    return;
                }
                setIsGrading(true);
                setTimeout(() => {
                    const qId = currentQuestion.id;
                    const kws = keywordsMap[qId] || [];
                    const studentLower = studentAnswer.toLowerCase();
                    let coveredCount = 0;
                    
                    const keywordResults = kws.map(kw => {
                        const kwWords = kw.toLowerCase().split(' ');
                        const matchCount = kwWords.filter(w => w.length > 3 && studentLower.includes(w)).length;
                        const isCovered = matchCount >= Math.ceil(kwWords.length * 0.4) || studentLower.includes(kw.toLowerCase());
                        if (isCovered) coveredCount++;
                        return {
                            keyword: kw,
                            status: isCovered ? 'covered' : 'missing',
                            explanation: isCovered ? 'Đã bao phủ ý chính.' : 'Chưa diễn đạt rõ ý này.'
                        };
                    });

                    const score = kws.length > 0 ? Math.round((coveredCount / kws.length) * 100) : 80;
                    const result = {
                        score: score >= 60 || kws.length === 0 ? score : 45,
                        overall: score >= 80 ? 'Xuất sắc! Bạn nắm rất chắc ý nghĩa.' : score >= 50 ? 'Khá tốt. Cần bổ sung thêm một vài ý.' : 'Cần cố gắng ôn tập lại.',
                        keywordResults,
                        betterVersion: currentQuestion.originalAnswer
                    };

                    setGradingResult(result);
                    setIsGrading(false);
                    if (result.score < 70 && !reviewMistakes.some(q => q.id === currentQuestion.id)) {
                        setReviewMistakes(prev => [...prev, currentQuestion]);
                    }
                }, 800);
            };

            const goToNext = (type) => {
                setShowNextOptions(false);
                setStudentAnswer('');
                setGradingResult(null);
                if (!documentData || !documentData.questions) return;
                if (type === 'sequential') {
                    if (currentQuestionIndex < documentData.questions.length - 1) {
                        setCurrentQuestionIndex(currentQuestionIndex + 1);
                    } else {
                        setCurrentQuestionIndex(0);
                    }
                } else if (type === 'random') {
                    const rand = Math.floor(Math.random() * documentData.questions.length);
                    setCurrentQuestionIndex(rand);
                }
            };

            const startQuiz = () => {
                if (!documentData || !documentData.questions || documentData.questions.length === 0) return;
                const shuffled = [...documentData.questions].sort(() => 0.5 - Math.random());
                setQuizQuestions(shuffled.slice(0, Math.min(5, shuffled.length)));
                setQuizIndex(0);
                setQuizAnswers({});
                setQuizResults(null);
                setViewMode('quiz');
            };

            if (!documentData) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50 flex items-center justify-center p-4">
                        <div className="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center">
                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-indigo-200 mb-6">
                                <i className="fa-solid fa-anchor"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-slate-900 mb-2">MemoryAnchor AI</h1>
                            <p className="text-slate-600 mb-8">Nền tảng ghi nhớ Q&A thông minh từ tài liệu của bạn. Tải lên file PDF, DOCX hoặc TXT để bắt đầu.</p>
                            
                            <label className="block w-full border-2 border-dashed border-indigo-300 rounded-xl p-8 cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition">
                                <i className="fa-solid fa-cloud-arrow-up text-4xl text-indigo-600 mb-3"></i>
                                <div className="font-semibold text-indigo-900">Nhấn để chọn tài liệu</div>
                                <div className="text-xs text-slate-500 mt-1">Hỗ trợ PDF, DOCX, TXT</div>
                                <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                            </label>

                            {loadingMessage && (
                                <div className="mt-4 text-indigo-600 font-medium flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-spinner animate-spin"></i> {loadingMessage}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setMobileSidebarOpen(!mobileSidebarOpen)} className="md:hidden text-slate-600 p-2">
                                <i className={`fa-solid ${mobileSidebarOpen ? 'fa-xmark' : 'fa-bars'} text-lg`}></i>
                            </button>
                            <div className="w-9 h-9 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-indigo-100">
                                <i className="fa-solid fa-anchor"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-slate-900 text-sm md:text-base leading-tight">MemoryAnchor</h1>
                                <p className="text-xs text-slate-500 truncate max-w-[150px] md:max-w-xs">{documentData.filename}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={startQuiz} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                                <i className="fa-solid fa-graduation-cap"></i> <span className="hidden sm:inline">Thi thử 5 câu</span>
                            </button>
                            <label className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer transition flex items-center gap-1.5">
                                <i className="fa-solid fa-file-arrow-up"></i> <span className="hidden sm:inline">Đổi file</span>
                                <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                            </label>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden relative">
                        <aside className={`absolute md:relative z-20 inset-y-0 left-0 w-80 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 ${mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                            <div className="p-3 border-b border-slate-100 flex gap-1 bg-slate-50">
                                <button onClick={() => { setViewMode('keywords'); setMobileSidebarOpen(false); }} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'keywords' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>
                                    Keywords
                                </button>
                                <button onClick={() => { setViewMode('study'); setMobileSidebarOpen(false); }} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'study' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>
                                    Study
                                </button>
                                <button onClick={() => { setViewMode('review'); setMobileSidebarOpen(false); }} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'review' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>
                                    Review ({reviewMistakes.length})
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-2 space-y-1">
                                {viewMode === 'review' ? (
                                    reviewMistakes.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-xs px-4">
                                            <i className="fa-solid fa-check-circle text-3xl mb-2 text-emerald-500"></i>
                                            <p>Chưa có câu hỏi cần ôn tập lại!</p>
                                        </div>
                                    ) : (
                                        reviewMistakes.map((q, idx) => (
                                            <div key={q.id} onClick={() => {
                                                const origIdx = documentData.questions.findIndex(item => item.id === q.id);
                                                if (origIdx !== -1) setCurrentQuestionIndex(origIdx);
                                                setViewMode('study');
                                                setMobileSidebarOpen(false);
                                            }} className="p-2.5 rounded-xl border border-amber-100 bg-amber-50/50 hover:bg-amber-50 cursor-pointer text-xs transition">
                                                <div className="font-bold text-amber-900 mb-1">Q#{idx + 1}</div>
                                                <div className="text-slate-700 line-clamp-2">{q.question}</div>
                                            </div>
                                        ))
                                    )
                                ) : (
                                    documentData.questions.map((q, idx) => {
                                        const isSelected = currentQuestionIndex === idx;
                                        const hasKw = (keywordsMap[q.id] || []).length > 0;
                                        return (
                                            <div key={q.id} onClick={() => { setCurrentQuestionIndex(idx); setMobileSidebarOpen(false); setGradingResult(null); setStudentAnswer(''); }} className={`p-2.5 rounded-xl cursor-pointer text-xs transition border ${isSelected ? 'bg-indigo-50 border-indigo-300 shadow-sm' : 'border-transparent hover:bg-slate-50'}`}>
                                                <div className="flex items-center justify-between mb-1">
                                                    <span className={`font-bold ${isSelected ? 'text-indigo-700' : 'text-slate-600'}`}>Q{idx + 1}</span>
                                                    {hasKw && <span className="w-2 h-2 rounded-full bg-amber-400" title="Đã có từ khóa"></span>}
                                                </div>
                                                <div className={`line-clamp-2 font-medium ${isSelected ? 'text-indigo-950 font-semibold' : 'text-slate-700'}`}>{q.question}</div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col items-center">
                            <div className="max-w-3xl w-full space-y-6">
                                {viewMode === 'quiz' ? (
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                                            <h2 className="text-lg font-bold text-slate-900"><i className="fa-solid fa-graduation-cap text-emerald-600 mr-2"></i> Bài Kiểm Tra Ngẫu Nhiên (5 câu)</h2>
                                            <span className="text-xs font-semibold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">Câu {quizIndex + 1} / {quizQuestions.length}</span>
                                        </div>

                                        {quizResults ? (
                                            <div className="space-y-6 text-center py-6">
                                                <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                                                    <i className="fa-solid fa-award"></i>
                                                </div>
                                                <h3 className="text-2xl font-bold text-slate-900">Hoàn thành bài kiểm tra!</h3>
                                                <button onClick={() => setViewMode('study')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition">
                                                    Quay lại chế độ học tập
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="space-y-6">
                                                <div>
                                                    <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Câu hỏi</div>
                                                    <div className="text-lg font-bold text-slate-900">{quizQuestions[quizIndex] ? quizQuestions[quizIndex].question : ''}</div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Câu trả lời của bạn</label>
                                                    <textarea rows="5" value={quizQuestions[quizIndex] ? (quizAnswers[quizQuestions[quizIndex].id] || '') : ''} onChange={(e) => {
                                                        if (!quizQuestions[quizIndex]) return;
                                                        setQuizAnswers({...quizAnswers, [quizQuestions[quizIndex].id]: e.target.value});
                                                    }} placeholder="Viết câu trả lời theo ý hiểu..." className="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm text-slate-800 leading-relaxed"></textarea>
                                                </div>

                                                <div className="flex justify-between">
                                                    {quizIndex > 0 && (
                                                        <button onClick={() => setQuizIndex(quizIndex - 1)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-xl text-sm transition">
                                                            Câu trước
                                                        </button>
                                                    )}
                                                    <div className="ml-auto">
                                                        {quizIndex < quizQuestions.length - 1 ? (
                                                            <button onClick={() => setQuizIndex(quizIndex + 1)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-xl text-sm shadow transition">
                                                                Tiếp theo <i className="fa-solid fa-arrow-right ml-1"></i>
                                                            </button>
                                                        ) : (
                                                            <button onClick={() => setQuizResults(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-xl text-sm shadow transition">
                                                                Nộp bài <i className="fa-solid fa-check ml-1"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : currentQuestion ? (
                                    <>
                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 sticky top-16 z-10">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-xs font-bold uppercase tracking-wider text-indigo-600">Câu hỏi #{currentQuestionIndex + 1}</span>
                                                <span className="text-xs text-slate-400 font-medium">{currentQuestionIndex + 1} / {documentData.questions.length}</span>
                                            </div>
                                            <h2 className="text-lg md:text-xl font-bold text-slate-900 leading-snug">{currentQuestion.question}</h2>
                                        </div>

                                        {viewMode === 'keywords' && (
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                                                <div>
                                                    <div className="flex items-center justify-between mb-2">
                                                        <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Đáp án gốc từ tài liệu (Bôi đen từ khóa)</label>
                                                        <span className="text-xs text-indigo-600 font-medium"><i className="fa-solid fa-highlighter mr-1"></i> Bôi đen văn bản bên dưới</span>
                                                    </div>
                                                    <div onMouseUp={handleTextSelection} className="p-5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 leading-relaxed text-sm md:text-base select-text cursor-text">
                                                        {currentQuestion.originalAnswer}
                                                    </div>
                                                </div>

                                                <div>
                                                    <div className="text-xs font-semibold text-slate-500 mb-2">Hoặc bấm chọn nhanh từ khóa:</div>
                                                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-2 bg-slate-50 border border-slate-200 rounded-xl">
                                                        {currentQuestion.originalAnswer.split(/[,\.\s]+/).filter(w => w.length > 3).map((word, idx) => (
                                                            <button key={idx} onClick={() => addKeywordDirect(word)} className="bg-white border border-slate-200 hover:bg-indigo-50 text-slate-700 text-xs px-2.5 py-1 rounded-lg transition shadow-2xs">
                                                                + {word}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Memory Anchors ({ (keywordsMap[currentQuestion.id] || []).length })</div>
                                                    {(keywordsMap[currentQuestion.id] || []).length === 0 ? (
                                                        <div className="text-xs text-slate-400 italic bg-slate-50 p-4 rounded-xl border border-dashed border-slate-200 text-center">
                                                            Chưa có từ khóa nào. Hãy bôi đen hoặc bấm chọn từ ở trên.
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-wrap gap-2">
                                                            {(keywordsMap[currentQuestion.id] || []).map((kw, i) => (
                                                                <span key={i} className="inline-flex items-center gap-2 bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1.5 rounded-lg border border-amber-200">
                                                                    <i className="fa-solid fa-lightbulb text-amber-600"></i> {kw}
                                                                    <button onClick={() => removeKeyword(kw)} className="text-amber-700 hover:text-red-600 ml-1">
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="pt-4 border-t border-slate-100 flex justify-end">
                                                    <button onClick={() => setViewMode('study')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition flex items-center gap-2">
                                                        <span>Xác nhận & Chuyển sang Study Mode</span> <i className="fa-solid fa-arrow-right"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {viewMode === 'study' && (
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                                                <div className="flex bg-slate-100 p-1 rounded-xl">
                                                    {[1, 2, 3].map((lvl) => {
                                                        const levelNames = { 1: 'Full Keywords', 2: 'Partial Keywords', 3: 'Pure Recall' };
                                                        return (
                                                            <button key={lvl} onClick={() => handleLevelChange(lvl)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${studyLevel === lvl ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}>
                                                                Level {lvl}: {lvl === 1 ? 'Full' : lvl === 2 ? 'Partial' : 'Recall'}
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {studyLevel < 3 && (
                                                    <div>
                                                        <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Memory Anchors / Hints</div>
                                                        <div className="flex flex-wrap gap-2">
                                                            {(keywordsMap[currentQuestion.id] || []).map((kw, i) => (
                                                                <span key={i} className="inline-flex items-center gap-1.5 bg-amber-100 text-amber-900 text-xs font-semibold px-3 py-1.5 rounded-lg border border-amber-200">
                                                                    <i className="fa-solid fa-lightbulb text-amber-600"></i>
                                                                    {studyLevel === 1 ? kw : kw.split(' ').map(w => w[0] + '...').join(' ')}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                <div>
                                                    <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Câu trả lời của bạn</div>
                                                    <textarea rows="6" value={studentAnswer} onChange={(e) => setStudentAnswer(e.target.value)} placeholder="Nhập câu trả lời theo ý hiểu..." className="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm md:text-base text-slate-800 leading-relaxed"></textarea>
                                                </div>

                                                <div className="flex items-center justify-between pt-2">
                                                    <div className="relative">
                                                        <button onClick={() => setShowNextOptions(!showNextOptions)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1.5">
                                                            <span>Câu tiếp theo</span> <i className="fa-solid fa-chevron-down text-xs"></i>
                                                        </button>
                                                        {showNextOptions && (
                                                            <div className="absolute left-0 bottom-full mb-2 w-48 bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-20">
                                                                <button onClick={() => goToNext('sequential')} className="w-full text-left px-4 py-2 text-xs font-medium text-slate-700 hover:bg-indigo-50">
                                                                    <i className="fa-solid fa-arrow-right mr-2"></i> Kế tiếp
                                                                </button>
                                                                <button onClick={() => goToNext('random')} className="w-full text-left px-4 py-2 text-xs font-medium text-slate-700 hover:bg-indigo-50">
                                                                    <i className="fa-solid fa-shuffle mr-2"></i> Ngẫu nhiên
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <button onClick={handleCheckAnswer} disabled={isGrading} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow-md transition flex items-center gap-2">
                                                        {isGrading ? <><i className="fa-solid fa-spinner animate-spin"></i> Đang chấm...</> : <><i className="fa-solid fa-check"></i> Kiểm tra</>}
                                                    </button>
                                                </div>

                                                {gradingResult && (
                                                    <div className="mt-6 pt-6 border-t border-slate-100 space-y-4 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-bold text-lg text-white shadow-sm ${gradingResult.score >= 70 ? 'bg-emerald-600' : 'bg-amber-500'}`}>
                                                                {gradingResult.score}%
                                                            </div>
                                                            <div>
                                                                <div className="font-bold text-slate-900 text-sm md:text-base">Đánh giá ý nghĩa</div>
                                                                <div className="text-xs text-slate-600">{gradingResult.overall}</div>
                                                            </div>
                                                        </div>

                                                        <div className="space-y-1.5">
                                                            {gradingResult.keywordResults.map((res, i) => (
                                                                <div key={i} className="flex items-start gap-2.5 text-xs bg-white p-3 rounded-xl border border-slate-200">
                                                                    <i className={`fa-solid mt-0.5 ${res.status === 'covered' ? 'fa-circle-check text-emerald-500' : 'fa-circle-xmark text-red-500'}`}></i>
                                                                    <div><span className="font-bold text-slate-900">{res.keyword}:</span> <span className="text-slate-600">{res.explanation}</span></div>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        <div>
                                                            <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Đáp án gốc</div>
                                                            <div className="p-3 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 italic">
                                                                "{gradingResult.betterVersion}"
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                ) : null}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
